name: R-CMD-check

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-arm64:
    name: Windows ARM64 (R-${{ matrix.r }})
    runs-on: windows-11-arm
    strategy:
      fail-fast: false
      matrix:
        r: [release, devel]
    steps:
      - uses: actions/checkout@v5

      - name: Cache Rtools45 ARM64
        uses: actions/cache@v5
        with:
          path: C:\rtools45-aarch64
          key: rtools45-aarch64-6768-6492

      - name: Install Rtools45 ARM64
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\rtools45-aarch64")) {
            curl.exe -sSL --retry 3 -o rtools45.exe "https://github.com/r-windows/rtools-chocolatey/releases/download/6768/rtools45-aarch64-6768-6492.exe"
            Start-Process "rtools45.exe" -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES" -Wait
            Remove-Item rtools45.exe -Force
          }
          "RTOOLS45_AARCH64_HOME=C:\rtools45-aarch64" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "R_PLATFORM_PKGTYPE=windows.binary.clang-aarch64" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install R (${{ matrix.r }}) for Windows ARM64
        shell: pwsh
        run: |
          if ("${{ matrix.r }}" -eq "devel") {
            $url = "https://github.com/r-devel/windows-arm64/releases/download/devel/R-devel-aarch64.exe"
          } else {
            $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/r-devel/windows-arm64/releases" -Headers @{"User-Agent"="gha"} |
              Where-Object { $_.tag_name -match '^[0-9]+\.[0-9]+\.[0-9]+$' } |
              Select-Object -First 1
            $asset = $rel.assets | Where-Object { $_.name -like "*-aarch64.exe" } | Select-Object -First 1
            $url = $asset.browser_download_url
          }
          Write-Host "Downloading R from $url"
          curl.exe -sSL --retry 3 --ssl-no-revoke -o Rinstall.exe $url
          Start-Process "Rinstall.exe" -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /DIR=C:\R" -Wait
          Remove-Item Rinstall.exe -Force
          "C:\R\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install dependencies
        shell: pwsh
        run: |
          $depsScript = Join-Path $env:RUNNER_TEMP 'frailtyhlnew_dependencies.R'
          $depsCode = @'
            cat('R version:', R.version.string, '\n');
            cat('Platform:', R.version[['platform']], '\n');
            lib <- Sys.getenv('R_LIBS_USER');
            if (!nzchar(lib)) lib <- file.path(Sys.getenv('RUNNER_TEMP'), 'rlib');
            dir.create(lib, recursive = TRUE, showWarnings = FALSE);
            .libPaths(c(lib, .libPaths()));
            cat('libPaths:', paste(.libPaths(), collapse = '; '), '\n');
            tryCatch(
              install.packages('cmprsk', lib = lib, repos = 'https://cran.r-universe.dev'),
              error = function(e) message('binary install note: ', conditionMessage(e))
            );
            if (!requireNamespace('cmprsk', quietly = TRUE)) {
              install.packages('cmprsk', lib = lib, repos = 'https://cloud.r-project.org', type = 'source');
            }
            stopifnot(requireNamespace('cmprsk', quietly = TRUE));
          '@
          [System.IO.File]::WriteAllText($depsScript, $depsCode, [System.Text.UTF8Encoding]::new($false))
          & C:\R\bin\Rscript.exe $depsScript *> deps.log
          $rc = $LASTEXITCODE
          Get-Content deps.log
          if ($rc -ne 0) {
            Get-Content deps.log | Select-Object -Last 30 | ForEach-Object { Write-Host "::error::$_" }
            exit $rc
          }
          $rlib = (& C:\R\bin\Rscript.exe -e "lib <- Sys.getenv('R_LIBS_USER'); if (!nzchar(lib)) lib <- file.path(Sys.getenv('RUNNER_TEMP'), 'rlib'); cat(normalizePath(lib, winslash = '/'))")
          "R_LIBS_USER=$rlib" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build & R CMD INSTALL --build (R-universe equivalent)
        shell: pwsh
        run: |
          & C:\R\bin\R.exe CMD build .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $pkgTar = (Get-ChildItem "frailtyHLnew_*.tar.gz" | Select-Object -First 1).Name
          New-Item -ItemType Directory -Path "mylib" -Force | Out-Null
          & C:\R\bin\R.exe CMD INSTALL $pkgTar --library=mylib --build *> install.log
          $rc = $LASTEXITCODE
          Get-Content install.log
          if ($rc -ne 0) {
            Get-Content install.log | Select-Object -Last 35 | ForEach-Object { Write-Host "::error::$_" }
            exit $rc
          }

      - name: R CMD check
        shell: pwsh
        env:
          _R_CHECK_FORCE_SUGGESTS_: "FALSE"
          _R_CHECK_CRAN_INCOMING_: "FALSE"
          _R_CHECK_CRAN_INCOMING_REMOTE_: "FALSE"
        run: |
          $pkgTar = (Get-ChildItem "frailtyHLnew_*.tar.gz" | Select-Object -First 1).Name
          & C:\R\bin\R.exe CMD check $pkgTar --no-manual
          $rc = $LASTEXITCODE
          if ($rc -ne 0) {
            if (Test-Path "frailtyHLnew.Rcheck/00install.out") {
              Get-Content "frailtyHLnew.Rcheck/00install.out"
              Select-String -Path "frailtyHLnew.Rcheck/00install.out" -Pattern "ERROR|WARNING|error:" | Select-Object -First 25 | ForEach-Object { Write-Host "::error::[00install] $($_.Line)" }
            }
            if (Test-Path "frailtyHLnew.Rcheck/00check.log") {
              Get-Content "frailtyHLnew.Rcheck/00check.log"
              Select-String -Path "frailtyHLnew.Rcheck/00check.log" -Pattern "ERROR|WARNING" | Select-Object -First 25 | ForEach-Object { Write-Host "::error::[00check] $($_.Line)" }
            }
            Get-ChildItem "frailtyHLnew.Rcheck/tests/*.Rout.fail" -ErrorAction SilentlyContinue | ForEach-Object {
              Get-Content $_.FullName
              Get-Content $_.FullName | Select-Object -Last 20 | ForEach-Object { Write-Host "::error::[test] $_" }
            }
            exit $rc
          }

  linux-clang-openmp:
    name: Linux Clang + OpenMP (--as-cran)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install R, Clang & libomp
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends r-base r-base-dev clang libomp-dev gfortran qpdf tidy

      - name: Configure Clang + OpenMP Makevars
        run: |
          mkdir -p ~/.R
          cat << 'EOF' > ~/.R/Makevars
          CC = clang
          SHLIB_LD = clang
          CFLAGS = -O2 -Wall -Wextra
          SHLIB_OPENMP_CFLAGS = -fopenmp
          SHLIB_OPENMP_LDFLAGS = -fopenmp
          EOF
          clang --version

      - name: Install dependencies
        run: |
          sudo Rscript -e "install.packages('cmprsk', repos = 'https://cloud.r-project.org')"

      - name: Build & R CMD check --as-cran
        env:
          _R_CHECK_FORCE_SUGGESTS_: "FALSE"
          _R_CHECK_CRAN_INCOMING_: "FALSE"
          _R_CHECK_CRAN_INCOMING_REMOTE_: "FALSE"
        run: |
          set -uo pipefail
          R CMD build .
          PKG_TAR=$(ls -1 frailtyHLnew_*.tar.gz | head -n 1)
          if ! R CMD check "$PKG_TAR" --as-cran --no-manual; then
            cat frailtyHLnew.Rcheck/00install.out || true
            cat frailtyHLnew.Rcheck/00check.log || true
            grep -E "ERROR|WARNING|error:|undefined symbol" frailtyHLnew.Rcheck/00install.out frailtyHLnew.Rcheck/00check.log 2>/dev/null | head -n 30 | while IFS= read -r line; do echo "::error::$line"; done
            for f in frailtyHLnew.Rcheck/tests/*.Rout.fail; do
              if [ -f "$f" ]; then
                cat "$f"
                tail -n 20 "$f" | while IFS= read -r line; do echo "::error::[$f] $line"; done
              fi
            done
            exit 1
          fi
